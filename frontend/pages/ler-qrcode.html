<!DOCTYPE html>
<html lang="pt-BR" data-page="ler-qrcode">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Abrir chamado | HelpDesk TI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../assets/css/ler-qrcode.css">
</head>

<body>

<div class="qr-reader-page">

    <div class="qr-reader-card">

        <div class="qr-logo">
            <i class="bi bi-qr-code-scan"></i>
        </div>

        <h1 class="qr-reader-title">
            Abrir chamado
        </h1>

        <p class="qr-reader-description">
            Aponte a câmera para o QR Code disponível
            no local onde você precisa de atendimento.
        </p>

        <div id="reader"></div>

        <div
            id="resultado"
            class="hidden"
        >

            <div class="location-box">

                <strong>
                    <i class="bi bi-geo-alt-fill me-1"></i>
                    Local identificado
                </strong>

                <span id="localIdentificado"></span>

            </div>

            <button
                class="btn btn-puc mt-3"
                id="btnAbrirChamado"
            >
                <i class="bi bi-ticket-detailed me-2"></i>
                Abrir chamado
            </button>

        </div>

        <div
            id="erro"
            class="alert alert-danger hidden mt-3"
        ></div>

        <div class="manual-link">

            <a href="novo-chamado.html">
                <i class="bi bi-pencil me-1"></i>
                Abrir chamado manualmente
            </a>

        </div>

    </div>

</div>



<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>


<script src="../assets/js/ler-qrcode.js"></script>

</body>
</html>
