services:
  - type: web
    name: projetopcuc
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 10000
      - key: DATABASE_HOST
        fromDatabase:
          name: helpdesk-ti-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: helpdesk-ti-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: helpdesk-ti-db
          property: database
      - key: DATABASE_USER
        fromDatabase:
          name: helpdesk-ti-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: helpdesk-ti-db
          property: password
      - key: FRONTEND_ORIGINS
        fromService:
          name: projetopcuc
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PUBLIC_FRONTEND_URL
        sync: false
      - key: SESSION_SECURE
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      - key: BOOTSTRAP_EMAIL
        sync: false
      - key: BOOTSTRAP_PASSWORD
        sync: false

databases:
  - name: helpdesk-ti-db
    plan: free



